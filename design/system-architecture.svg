<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8CA0BF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27C93F"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFB000"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="1000" fill="#0B1220"/>

  <!-- ================= HEADER ================= -->
  <text x="60" y="70" fill="#E6EDF7" font-size="42" font-weight="bold" letter-spacing="3">THE BREAKER</text>
  <text x="60" y="100" fill="#8CA0BF" font-size="18" letter-spacing="1">HARDWARE DEAD-MAN SWITCH GATING AN AUTONOMOUS AGENT FLEET</text>
  <line x1="60" y1="116" x2="1540" y2="116" stroke="#2A3A5C" stroke-width="1"/>
  <text x="1540" y="70" text-anchor="end" fill="#27C93F" font-size="16" font-family="Menlo, monospace">SAFE STATE = HALT</text>
  <text x="1540" y="94" text-anchor="end" fill="#8CA0BF" font-size="14" font-family="Menlo, monospace">fail safe, never fail open</text>

  <!-- ================= ZONE 1: DESK HARDWARE ================= -->
  <rect x="60" y="150" width="420" height="360" rx="8" fill="#111A2E" stroke="#2A3A5C" stroke-width="1"/>
  <text x="80" y="182" fill="#E6EDF7" font-size="20" font-weight="bold" letter-spacing="2">DESK HARDWARE</text>
  <text x="80" y="204" fill="#8CA0BF" font-size="13">physical, on the desk</text>

  <!-- guarded toggle switch -->
  <rect x="120" y="232" width="120" height="150" rx="6" fill="#0B1220" stroke="#FFB000" stroke-width="2"/>
  <rect x="140" y="222" width="80" height="20" rx="4" fill="#1A2740" stroke="#FFB000" stroke-width="2"/>
  <text x="180" y="237" text-anchor="middle" fill="#FFB000" font-size="11" font-family="Menlo, monospace">GUARD</text>
  <line x1="180" y1="310" x2="180" y2="262" stroke="#27C93F" stroke-width="8" stroke-linecap="round"/>
  <circle cx="180" cy="310" r="12" fill="#1A2740" stroke="#8CA0BF" stroke-width="2"/>
  <text x="180" y="404" text-anchor="middle" fill="#E6EDF7" font-size="14">guarded toggle switch</text>
  <text x="180" y="424" text-anchor="middle" fill="#8CA0BF" font-size="12">CLOSED = armed / OPEN = HALT</text>

  <!-- status LED -->
  <circle cx="320" cy="270" r="18" fill="#27C93F"/>
  <circle cx="320" cy="270" r="18" fill="none" stroke="#2A3A5C" stroke-width="1"/>
  <text x="320" y="308" text-anchor="middle" fill="#E6EDF7" font-size="14">status LED</text>
  <text x="320" y="326" text-anchor="middle" fill="#8CA0BF" font-size="11">green armed /</text>
  <text x="320" y="340" text-anchor="middle" fill="#8CA0BF" font-size="11">amber HALT</text>

  <!-- Phase 2 gauges ghosted -->
  <g opacity="0.22">
    <circle cx="150" cy="460" r="26" fill="none" stroke="#8CA0BF" stroke-width="2"/>
    <line x1="150" y1="460" x2="168" y2="446" stroke="#8CA0BF" stroke-width="2"/>
    <circle cx="230" cy="460" r="26" fill="none" stroke="#8CA0BF" stroke-width="2"/>
    <line x1="230" y1="460" x2="214" y2="444" stroke="#8CA0BF" stroke-width="2"/>
    <text x="310" y="465" fill="#8CA0BF" font-size="13" font-style="italic">Phase 2: gauges</text>
  </g>

  <!-- ================= ZONE 2: PI ZERO 2 W ================= -->
  <rect x="590" y="150" width="420" height="360" rx="8" fill="#111A2E" stroke="#2A3A5C" stroke-width="1"/>
  <text x="610" y="182" fill="#E6EDF7" font-size="20" font-weight="bold" letter-spacing="2">PI ZERO 2 W</text>
  <text x="610" y="204" fill="#8CA0BF" font-size="13">tailnet node</text>

  <!-- GPIO reader -->
  <rect x="610" y="226" width="380" height="70" rx="6" fill="#0B1220" stroke="#2A3A5C" stroke-width="1"/>
  <text x="628" y="252" fill="#E6EDF7" font-size="15" font-weight="bold">GPIO reader</text>
  <text x="628" y="276" fill="#FFB000" font-size="14" font-family="Menlo, monospace">GPIO26</text>
  <text x="710" y="276" fill="#8CA0BF" font-size="13" font-family="Menlo, monospace">internal pull-up</text>

  <!-- token service -->
  <rect x="610" y="308" width="380" height="70" rx="6" fill="#0B1220" stroke="#2A3A5C" stroke-width="1"/>
  <text x="628" y="334" fill="#E6EDF7" font-size="15" font-weight="bold">authority token service</text>
  <text x="628" y="358" fill="#27C93F" font-size="14" font-family="Menlo, monospace">GET /authority</text>

  <!-- TTL note -->
  <rect x="610" y="390" width="380" height="70" rx="6" fill="#0B1220" stroke="#FFB000" stroke-width="1"/>
  <text x="628" y="416" fill="#FFB000" font-size="14" font-weight="bold">short-TTL signed token</text>
  <text x="628" y="440" fill="#8CA0BF" font-size="13" font-family="Menlo, monospace">TTL ~3s  ·  expires -> HALT</text>

  <!-- ================= ZONE 3: MAC BRAIN ================= -->
  <rect x="1120" y="150" width="420" height="360" rx="8" fill="#111A2E" stroke="#2A3A5C" stroke-width="1"/>
  <text x="1140" y="182" fill="#E6EDF7" font-size="20" font-weight="bold" letter-spacing="2">MAC BRAIN</text>
  <text x="1140" y="204" fill="#8CA0BF" font-size="13">daemons bind loopback, exposed via Tailscale serve</text>

  <!-- agent fleet -->
  <rect x="1140" y="226" width="380" height="60" rx="6" fill="#0B1220" stroke="#2A3A5C" stroke-width="1"/>
  <text x="1158" y="252" fill="#E6EDF7" font-size="15" font-weight="bold">agent fleet</text>
  <text x="1158" y="272" fill="#8CA0BF" font-size="12">research, monitoring, ops</text>

  <!-- pre-action gate -->
  <rect x="1140" y="298" width="380" height="60" rx="6" fill="#0B1220" stroke="#FFB000" stroke-width="2"/>
  <text x="1158" y="324" fill="#FFB000" font-size="15" font-weight="bold">pre-action gate</text>
  <text x="1158" y="344" fill="#8CA0BF" font-size="12">every action requires a fresh valid token first</text>

  <!-- actions -->
  <rect x="1140" y="370" width="185" height="60" rx="6" fill="#0B1220" stroke="#27C93F" stroke-width="1"/>
  <text x="1232" y="396" text-anchor="middle" fill="#27C93F" font-size="14">run research</text>
  <text x="1232" y="416" text-anchor="middle" fill="#8CA0BF" font-size="11">only if gate passes</text>
  <rect x="1335" y="370" width="185" height="60" rx="6" fill="#0B1220" stroke="#27C93F" stroke-width="1"/>
  <text x="1427" y="396" text-anchor="middle" fill="#27C93F" font-size="14">execute task</text>
  <text x="1427" y="416" text-anchor="middle" fill="#8CA0BF" font-size="11">only if gate passes</text>

  <!-- ================= WIRING: switch -> Pi GPIO ================= -->
  <path d="M480,300 L590,300" stroke="#FFB000" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="535" y="290" text-anchor="middle" fill="#FFB000" font-size="11" font-family="Menlo, monospace">GPIO26</text>
  <text x="535" y="320" text-anchor="middle" fill="#8CA0BF" font-size="11">wired</text>

  <!-- ================= TAILNET TRANSPORT (Pi <-> Mac) ================= -->
  <rect x="1010" y="150" width="110" height="360" fill="#0B1220" stroke="#2A3A5C" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="1065" y="470" text-anchor="middle" fill="#8CA0BF" font-size="13" transform="rotate(-90 1065 470)">tailnet · identity = Tailscale login</text>

  <!-- token flow arrows over tailnet, numbered 1-4 -->
  <!-- step 1: agent -> gate to request -->
  <circle cx="1140" cy="328" r="0" />
  <path d="M1140,328 L1065,328 L1065,240 L1000,240" stroke="#8CA0BF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="1092" cy="240" r="12" fill="#0B1220" stroke="#E6EDF7" stroke-width="1.5"/>
  <text x="1092" y="245" text-anchor="middle" fill="#E6EDF7" font-size="13" font-weight="bold">1</text>
  <text x="1046" y="216" text-anchor="middle" fill="#8CA0BF" font-size="11" font-family="Menlo, monospace">GET /authority</text>

  <circle cx="1065" cy="300" r="12" fill="#0B1220" stroke="#E6EDF7" stroke-width="1.5"/>
  <text x="1065" y="305" text-anchor="middle" fill="#E6EDF7" font-size="13" font-weight="bold">2</text>
  <text x="1065" y="284" text-anchor="middle" fill="#8CA0BF" font-size="10">over tailnet</text>

  <!-- step 3: Pi checks GPIO26 (internal marker) -->
  <circle cx="800" cy="486" r="12" fill="#0B1220" stroke="#E6EDF7" stroke-width="1.5"/>
  <text x="800" y="491" text-anchor="middle" fill="#E6EDF7" font-size="13" font-weight="bold">3</text>
  <text x="820" y="491" fill="#8CA0BF" font-size="12">Pi checks GPIO26 state</text>
  <path d="M800,378 L800,474" stroke="#8CA0BF" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

  <!-- step 4: token or 503 returns Pi -> Mac -->
  <path d="M1000,360 L1065,360 L1065,340 L1140,340" stroke="#27C93F" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <circle cx="1092" cy="360" r="12" fill="#0B1220" stroke="#E6EDF7" stroke-width="1.5"/>
  <text x="1092" y="365" text-anchor="middle" fill="#E6EDF7" font-size="13" font-weight="bold">4</text>
  <text x="1046" y="392" text-anchor="middle" fill="#27C93F" font-size="11" font-family="Menlo, monospace">token TTL~3s</text>
  <text x="1046" y="406" text-anchor="middle" fill="#FFB000" font-size="11" font-family="Menlo, monospace">or 503 HALT</text>

  <!-- ================= FAIL-SAFE TRUTH TABLE ================= -->
  <text x="60" y="580" fill="#E6EDF7" font-size="20" font-weight="bold" letter-spacing="2">FAIL-SAFE TRUTH TABLE</text>
  <g font-size="15">
    <!-- header -->
    <rect x="60" y="596" width="560" height="44" fill="#1A2740" stroke="#2A3A5C" stroke-width="1"/>
    <rect x="620" y="596" width="200" height="44" fill="#1A2740" stroke="#2A3A5C" stroke-width="1"/>
    <text x="78" y="624" fill="#8CA0BF" font-weight="bold" letter-spacing="1">CONDITION</text>
    <text x="720" y="624" text-anchor="middle" fill="#8CA0BF" font-weight="bold" letter-spacing="1">RESULT</text>

    <!-- row 1: switch OPEN -> HALT -->
    <rect x="60" y="640" width="560" height="44" fill="#0B1220" stroke="#2A3A5C" stroke-width="1"/>
    <rect x="620" y="640" width="200" height="44" fill="#3A2A0E" stroke="#2A3A5C" stroke-width="1"/>
    <text x="78" y="668" fill="#E6EDF7">switch OPEN</text>
    <text x="720" y="668" text-anchor="middle" fill="#FFB000" font-weight="bold" letter-spacing="2">HALT</text>

    <!-- row 2: switch CLOSED + fresh token -> ACT -->
    <rect x="60" y="684" width="560" height="44" fill="#0B1220" stroke="#2A3A5C" stroke-width="1"/>
    <rect x="620" y="684" width="200" height="44" fill="#12331A" stroke="#2A3A5C" stroke-width="1"/>
    <text x="78" y="712" fill="#E6EDF7">switch CLOSED + fresh token</text>
    <text x="720" y="712" text-anchor="middle" fill="#27C93F" font-weight="bold" letter-spacing="2">ACT</text>

    <!-- row 3: Pi process dead -> HALT -->
    <rect x="60" y="728" width="560" height="44" fill="#0B1220" stroke="#2A3A5C" stroke-width="1"/>
    <rect x="620" y="728" width="200" height="44" fill="#3A2A0E" stroke="#2A3A5C" stroke-width="1"/>
    <text x="78" y="756" fill="#E6EDF7">Pi process dead <tspan fill="#8CA0BF" font-size="13">(no token to fetch)</tspan></text>
    <text x="720" y="756" text-anchor="middle" fill="#FFB000" font-weight="bold" letter-spacing="2">HALT</text>

    <!-- row 4: network partition -> HALT -->
    <rect x="60" y="772" width="560" height="44" fill="#0B1220" stroke="#2A3A5C" stroke-width="1"/>
    <rect x="620" y="772" width="200" height="44" fill="#3A2A0E" stroke="#2A3A5C" stroke-width="1"/>
    <text x="78" y="800" fill="#E6EDF7">network partition <tspan fill="#8CA0BF" font-size="13">(fetch fails)</tspan></text>
    <text x="720" y="800" text-anchor="middle" fill="#FFB000" font-weight="bold" letter-spacing="2">HALT</text>

    <!-- row 5: token expired / clock skew -> HALT -->
    <rect x="60" y="816" width="560" height="44" fill="#0B1220" stroke="#2A3A5C" stroke-width="1"/>
    <rect x="620" y="816" width="200" height="44" fill="#3A2A0E" stroke="#2A3A5C" stroke-width="1"/>
    <text x="78" y="844" fill="#E6EDF7">token expired / clock skew</text>
    <text x="720" y="844" text-anchor="middle" fill="#FFB000" font-weight="bold" letter-spacing="2">HALT</text>
  </g>

  <!-- ================= CALLOUT ================= -->
  <rect x="880" y="596" width="660" height="264" rx="8" fill="#111A2E" stroke="#FFB000" stroke-width="2"/>
  <text x="912" y="640" fill="#FFB000" font-size="18" font-weight="bold" letter-spacing="2">DEAD-MAN PRINCIPLE</text>
  <line x1="912" y1="656" x2="1508" y2="656" stroke="#2A3A5C" stroke-width="1"/>
  <text x="912" y="704" fill="#E6EDF7" font-size="24" font-weight="bold">The agents do not need to be told</text>
  <text x="912" y="740" fill="#E6EDF7" font-size="24" font-weight="bold">to stop.</text>
  <text x="912" y="792" fill="#E6EDF7" font-size="24">They lose the ability to <tspan fill="#FFB000" font-weight="bold">prove</tspan></text>
  <text x="912" y="828" fill="#E6EDF7" font-size="24">they may continue.</text>

  <!-- ================= FOOTER ================= -->
  <line x1="60" y1="952" x2="1540" y2="952" stroke="#2A3A5C" stroke-width="1"/>
  <text x="60" y="978" fill="#8CA0BF" font-size="13" font-family="Menlo, monospace">The Breaker - system architecture - rev A - 2026-07-18</text>
</svg>
